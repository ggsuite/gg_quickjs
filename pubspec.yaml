name: gg_quickjs
description: QuickJS-ng for Dart - its C sources for the build hooks of native packages and a Dart binding with typed values, a background isolate and a sandbox.
version: 0.0.1
repository: https://github.com/ggsuite/gg_quickjs
issue_tracker: https://github.com/ggsuite/gg_quickjs/issues

topics:
  - javascript
  - quickjs
  - ffi
  - sandbox
  - native-assets

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.2.0
  hooks: ^2.2.0
  logging: ^1.3.0
  meta: ^1.19.0
  native_toolchain_c: ^0.19.5
  path: ^1.9.1
  record_use: ^1.1.1

dev_dependencies:
  dna_ggsuite: ^0.5.0
  helix: ^1.12.0
  lints: ^6.0.0
  test: ^1.33.0
